services:
  vinylr:
    build: .
    # NOTA: NO fijar container_name aquí. Un nombre fijo choca si el
    # proyecto está abierto en más de un checkout/entorno a la vez
    # (ej. un devcontainer viejo + uno nuevo en otra carpeta) — Docker no
    # permite 2 contenedores con el mismo nombre corriendo simultáneamente.
    # Sin este campo, Docker Compose nombra el contenedor automáticamente
    # usando el nombre del proyecto/carpeta, que sí es único por checkout.
    env_file:
      - .env
    volumes:
      # Monta el código para que los cambios se reflejen sin rebuild.
      - ./src:/app/src
      # Monta data/ para que los JSON generados aparezcan también en tu
      # máquina (fuera del contenedor), no solo adentro.
      - ./data:/app/data
    # Mantiene el contenedor "vivo" si lo corres con `docker compose up -d`,
    # útil si prefieres entrar con una shell interactiva (ver README).
    tty: true
    stdin_open: true