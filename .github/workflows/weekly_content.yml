
# Corre el pipeline de contenido de Vinylr DOS veces por semana y deja los
# resultados listos para revisión humana (como artifact descargable, NUNCA
# publica nada solo):
#
#   LUNES   -> duelos intra-país (#1 vs #2 de cada país)
#   VIERNES -> duelos cruzados entre países + el post "Top 10 LatAm"
#
# Las imágenes se generan 100% localmente con Playwright + HTML/CSS (ver
# src/local_render_client.py) — ya NO se usa APITemplate.io, así que no
# hace falta ninguna API key ni template_id para esa parte.
#
# Setup requerido (una sola vez, en GitHub):
#   Settings → Secrets and variables → Actions → New repository secret
#     - LASTFM_API_KEY
#
# También se puede correr manualmente desde la pestaña "Actions" del repo
# (botón "Run workflow"), eligiendo qué generar sin esperar al cron —
# útil para pruebas.
 
name: Generar contenido semanal (Vinylr)
 
on:
  schedule:
    - cron: "0 8 * * 1" # Lunes 08:00 UTC (~02:00 CDMX) -> duelos intra-país
    - cron: "0 8 * * 5" # Viernes 08:00 UTC (~02:00 CDMX) -> duelos cruzados + Top 10 LatAm
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué generar (solo aplica al correrlo manualmente desde Actions)"
        required: true
        default: both
        type: choice
        options:
          - monday # duelos intra-país
          - friday # duelos cruzados + Top 10 LatAm
          - both
 
jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Instalar dependencias
        run: pip install -r requirements.txt
 
      - name: Instalar Chromium para el render local (Playwright)
        run: python -m playwright install --with-deps chromium
 
      # Traduce el trigger (cron de Lunes/Viernes, o la elección manual en
      # workflow_dispatch) a un solo valor MODE que los pasos de abajo usan
      # en sus condiciones `if:`. github.event.schedule trae el cron EXACTO
      # que disparó esta corrida cuando el trigger es "schedule".
      - name: Determinar qué generar hoy
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * 1" ]; then
            echo "value=monday" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * 5" ]; then
            echo "value=friday" >> "$GITHUB_OUTPUT"
          else
            echo "value=both" >> "$GITHUB_OUTPUT"
          fi
          echo "Modo resuelto: $(cat "$GITHUB_OUTPUT" | tail -n1)"
 
      - name: Obtener álbumes en tendencia (Last.fm)
        working-directory: src
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python fetch_trending.py --top 2 --countries Mexico Argentina Colombia Chile
 
      - name: "Lunes: duelos intra-país (#1 vs #2)"
        if: steps.mode.outputs.value == 'monday' || steps.mode.outputs.value == 'both'
        working-directory: src
        run: python generate_duels.py --type country
 
      - name: "Viernes: duelos cruzados entre países"
        if: steps.mode.outputs.value == 'friday' || steps.mode.outputs.value == 'both'
        working-directory: src
        run: python generate_duels.py --type cross
 
      - name: "Viernes: Top 10 LatAm"
        if: steps.mode.outputs.value == 'friday' || steps.mode.outputs.value == 'both'
        working-directory: src
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python generate_top10.py
 
      - name: Subir resultados para revisión humana
        uses: actions/upload-artifact@v4
        with:
          name: vinylr-${{ steps.mode.outputs.value }}-${{ github.run_number }}
          path: data/generated/
          retention-days: 14
 























